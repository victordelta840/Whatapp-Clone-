<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WhatsApp</title>
    <meta
      name="description"
      content="WhatsApp Web — Real-time direct and group messaging, voice notes, media sharing, status updates, and one-to-one audio/video calls."
    />
    <meta property="og:title" content="WhatsApp" />
    <meta
      property="og:description"
      content="Real-time direct and group messaging, voice notes, media sharing, status updates, and one-to-one audio/video calls."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#00A884" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WhatsApp" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('converse-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            stored === 'dark' || (stored !== 'light' && prefersDark) ? 'dark' : 'light';
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#111B21');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface text-text-primary antialiased selection:bg-brand/20 selection:text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
